name: news
on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # off the busy :00/:15 marks; GitHub may still start late
  workflow_dispatch: {}      # "Run workflow" button for a manual run
permissions:
  contents: write            # to save seen.json back to the repo
jobs:
  run:
    concurrency:
      group: news            # never two runs at once -> no double posts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                # latest seen.json, not the commit from when the run was queued
      - name: Post news
        run: python3 bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save seen.json
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          # merge with whatever is on main now, so a parallel run can't erase our list
          cp seen.json "$RUNNER_TEMP/mine.json"
          git fetch -q origin main && git reset -q --hard origin/main
          python3 -c "import json,sys; a=json.load(open('seen.json')); b=json.load(open(sys.argv[1])); json.dump((a+[x for x in b if x not in set(a)])[-5000:], open('seen.json','w'))" "$RUNNER_TEMP/mine.json"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen news" && (git push || (git pull -q --rebase && git push)))
  live:                        # text live coverage of a UFC event, exits at once when none is on
    concurrency:
      group: live
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Live coverage
        run: python3 live.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save live.json
        if: always()
        run: |
          [ -f live.json ] || exit 0
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "update live state"
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 5; done
