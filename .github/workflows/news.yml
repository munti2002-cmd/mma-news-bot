name: news
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may start runs a few minutes late
  workflow_dispatch: {}      # "Run workflow" button for a manual run
permissions:
  contents: write            # to save seen.json back to the repo
concurrency:
  group: news                # never two runs at once -> no double posts
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - name: Post news
        run: python3 bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save seen.json
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen news" && git push)
